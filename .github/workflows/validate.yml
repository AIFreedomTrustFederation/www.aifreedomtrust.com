{
  "name": "Portal Validation",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "portal-validation-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Use Python 3.13",
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Compile validator",
          "run": "python -m py_compile scripts/validate_static_site.py"
        },
        {
          "name": "Validate static portal",
          "run": "python scripts/validate_static_site.py"
        }
      ]
    }
  }
}
