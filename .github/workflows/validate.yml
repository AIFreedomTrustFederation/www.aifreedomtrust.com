{
  "name": "Portal Validation",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "portal-validation-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Use Python 3.13",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Compile validator",
          "run": "python -m py_compile scripts/validate_static_site.py"
        },
        {
          "name": "Validate static portal",
          "run": "python scripts/validate_static_site.py"
        }
      ]
    }
  }
}
