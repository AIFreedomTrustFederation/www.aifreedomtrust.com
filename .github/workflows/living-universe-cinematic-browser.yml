name: Living Universe 3.2 Cinematic Browser Acceptance
on:
  pull_request:
    paths:
      - 'cinematic-*'
      - 'universal-zoom.js'
      - 'white-paper-*'
      - 'tests/white-paper-*'
      - 'tests/universal-zoom*'
      - 'lineage-data.js'
      - 'tests/living-universe-browser.mjs'
      - '.github/workflows/living-universe-cinematic-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start canonical HTML server
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 > /tmp/aift-cinematic-http.log 2>&1 &
          echo $! > /tmp/aift-cinematic-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4178/cinematic-world.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aift-cinematic-http.log
          exit 1
      - name: Verify source-backed contracts
        run: |
          node --test tests/cinematic-world.test.mjs tests/cinematic-seven-movements.test.mjs tests/universal-zoom.test.mjs tests/cinematic-mobile-framing.test.mjs tests/cinematic-universal-frame.test.mjs tests/white-paper-tree.test.mjs
      - name: Exercise real Chromium camera and pilgrimage journey at four widths
        run: node tests/living-universe-browser.mjs
      - name: Exercise native two-pointer zoom on mobile and tablet
        run: node tests/universal-zoom-browser.mjs
      - name: Verify centered mobile Tree framing and capture screenshots
        run: node tests/cinematic-mobile-framing-browser.mjs
      - name: Verify universal mobile, landscape, tablet, desktop framing and browser magnification
        run: node tests/cinematic-universal-frame-browser.mjs
      - name: Walk the mobile White Paper, source chapters and Tree labels
        run: node tests/white-paper-tree-browser.mjs
      - name: Audit all major mobile portal routes, preserving diagnostics
        run: node tests/white-paper-mobile-site-audit.mjs
      - name: Publish screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-tree-360-390-768-1280
          path: |
            artifacts/living-universe/
            artifacts/white-paper/
            artifacts/mobile-site-audit/
          if-no-files-found: warn
