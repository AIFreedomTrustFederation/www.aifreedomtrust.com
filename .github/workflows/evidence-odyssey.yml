name: Evidence Odyssey contract
on:
  pull_request:
    paths:
      - 'data/living-universe.json'
      - 'world-contract.mjs'
      - 'evidence-odyssey.mjs'
      - 'living-universe.html'
      - 'tests/**'
      - '.github/workflows/evidence-odyssey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check world-contract.mjs && node --check evidence-odyssey.mjs
      - run: node tests/evidence-odyssey.test.mjs
      - run: node tests/living-universe.test.mjs
