name: Portal to MoBox lineage acceptance
on:
  pull_request:
    paths:
      - 'data/living-universe.json'
      - 'published-expedition-bridge.mjs'
      - 'world-lineage-interchange.mjs'
      - 'tests/portal-mobox-acceptance.mjs'
      - '.github/workflows/portal-mobox-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lineage-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out portal exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: portal
      - name: Check out MoBox integration draft
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: AIFreedomTrustFederation/AIFT-OS
          ref: 3a6f4922ade690c7aa4aa2259de9b3c507888ae6
          persist-credentials: false
          path: AIFT-OS
      - name: Record both exact checkout heads
        run: |
          echo "Portal head: $(git -C portal rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git -C portal rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          echo "MoBox head: $(git -C AIFT-OS rev-parse HEAD)"
          test "$(git -C AIFT-OS rev-parse HEAD)" = "3a6f4922ade690c7aa4aa2259de9b3c507888ae6"
          node --version
          go version
      - name: Execute real published-manifest interchange and MoBox Go contract tests
        run: node portal/tests/portal-mobox-acceptance.mjs "$GITHUB_WORKSPACE/AIFT-OS"
      - name: Record machine-readable source-contract evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync,existsSync,mkdirSync} from 'node:fs';
          const sha = dir => existsSync(dir+'/.git') ? execFileSync('git',['-C',dir,'rev-parse','HEAD'],{encoding:'utf8'}).trim() : null;
          const evidence = {
            schema:'aift.federation.source-contract-evidence/1',
            status:process.env.JOB_STATUS==='success'?'source-contract-verified':'not-verified',
            runUrl:process.env.RUN_URL,
            repositories:[
              {repository:'AIFreedomTrustFederation/www.aifreedomtrust.com',revision:sha('portal'),role:'producer'},
              {repository:'AIFreedomTrustFederation/AIFT-OS',revision:sha('AIFT-OS'),role:'consumer'}
            ],
            command:'node portal/tests/portal-mobox-acceptance.mjs "$GITHUB_WORKSPACE/AIFT-OS"',
            commandOutcome:process.env.JOB_STATUS==='success'?'passed':'not-confirmed',
            securityGates:{readOnlyCheckout:true,consumerPinned:true,credentialPersistence:false},
            dependencyContract:'aift.lineage.interchange/1',
            deploymentStatus:'not-tested',
            limitations:['Browser file-import handler not exercised','Android accessibility not tested','Genesis, Runtime, Forge, TheMindofAll and VPS not end-to-end verified']
          };
          mkdirSync('acceptance-evidence',{recursive:true});
          writeFileSync('acceptance-evidence/portal-mobox.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
      - name: Upload source-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-mobox-source-contract-evidence
          path: acceptance-evidence/portal-mobox.json
          if-no-files-found: error
      - name: Confirm both checkouts remain unchanged
        run: |
          test -z "$(git -C portal status --porcelain)"
          test -z "$(git -C AIFT-OS status --porcelain)"
# Pinned MoBox PR #63 head for reproducible cross-repository acceptance.
# Advance this SHA deliberately when consumer changes are reviewed; this
# source-contract gate does not establish browser or Android accessibility.
